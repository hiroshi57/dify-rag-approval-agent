<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>実検索版</b>：質問を自由入力すると、登録された規程本文を<b>ブラウザ内で実際に検索（語彙スコア＋同義語展開）</b>し、根拠となる条文を引用して回答します。規程に無いことは<b>答えません</b>（作文しません）。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
const RULES0=`### 経費精算規程 第3条
経費精算の締め日は毎月20日とする。20日を過ぎた申請は翌月扱いとする。
### 経費精算規程 第4条
5万円を超える経費は部長の承認を必要とする。5万円以下は上長の承認とする。
### 経費精算規程 第5条
経費申請には領収書等の証憑の添付を必須とする。証憑のない申請は却下する。
### 就業規則 第12条（有給休暇）
有給休暇は取得希望日の3営業日前までに勤怠システムから申請すること。繁忙期は上長と調整すること。
### 就業規則 第15条（在宅勤務）
在宅勤務は週3日までとする。事前に上長へ申請し承認を得ること。
### 情報セキュリティ規程 第8条
生成AIサービスへ顧客情報および個人情報を入力してはならない。違反した場合は懲戒の対象となる。
### 備品購入規程 第2条
1万円未満の備品は総務へ直接依頼できる。1万円以上は稟議申請を必要とする。
### 出張規程 第6条
出張は事前に出張申請書の提出と上長承認を必要とする。日帰り出張の日当は2000円とする。`;

const SYN={"締め日":["締め","期限","締切"],"いつまで":["締め日","期限","営業日","20日"],
  "承認":["決裁","上長","部長"],"誰":["部長","上長","総務"],
  "領収書":["証憑"],"レシート":["証憑","領収書"],
  "休暇":["有給休暇","有給"],"有給":["有給休暇"],"休み":["有給休暇","休暇"],
  "在宅":["在宅勤務","テレワーク"],"リモート":["在宅勤務"],
  "AI":["生成AI"],"ChatGPT":["生成AI"],"顧客情報":["個人情報"],"個人情報":["顧客情報"],
  "買いたい":["備品","購入","稟議"],"備品":["購入","稟議"],
  "出張":["出張申請","日当"],"経費":["経費精算","精算"]};
const PARTICLE=["の","を","に","は","が","で","と","も","へ","や","か","ば","ね","よ","し","て","た","な","だ","ど","ら","れ","る","い","う","ん","ま","す"];
const STOPGRAM=["です","ます","たい","する","した","こと","ため","場合","どう","なる","たら","ある","いる","これ","それ","でき","よい"];
function isNoise(g){
  if(STOPGRAM.includes(g))return true;
  const hira=c=>/[ぁ-ん]/.test(c);
  if(hira(g[0])&&hira(g[1])&&(PARTICLE.includes(g[0])||PARTICLE.includes(g[1])))return true;
  return false;
}
function tokenize(s){
  const t=[]; const jp=(s||"").replace(/[^぀-ヿ一-龯ａ-ｚA-Za-z0-9]/g,"");
  for(let i=0;i<jp.length-1;i++){const g=jp.substr(i,2); if(!isNoise(g))t.push(g);}
  return t;
}
function parseRules(text){
  return text.split(/^###\s*/m).map(s=>s.trim()).filter(Boolean).map((p,i)=>{
    const nl=p.indexOf("\n");
    const cite=nl>0?p.slice(0,nl).trim():p.slice(0,20);
    const body=nl>0?p.slice(nl+1).trim():"";
    return {id:"R"+(i+1), cite, body, text:cite+" "+body};
  });
}
function expandTerms(q){const out=[];Object.keys(SYN).forEach(k=>{if(q.includes(k))SYN[k].forEach(s=>out.push(s));});return out;}
function bm25(rule,qTokens,rules,cache){
  const dt=cache.get(rule.id); const len=dt.length||1;
  let avg=0; rules.forEach(r=>{avg+=cache.get(r.id).length;}); avg=avg/(rules.length||1)||1;
  const k1=1.5,b=0.75; let s=0;
  [...new Set(qTokens)].forEach(t=>{
    const tf=dt.filter(x=>x===t).length; if(!tf)return;
    const df=rules.filter(r=>cache.get(r.id).includes(t)).length||1;
    const idf=Math.log(1+(rules.length-df+0.5)/(df+0.5));
    s+=idf*(tf*(k1+1))/(tf+k1*(1-b+b*len/avg));
  });
  return s;
}
function retrieve(q,rules){
  const cache=new Map(); rules.forEach(r=>cache.set(r.id,tokenize(r.text)));
  const base=tokenize(q), syn=expandTerms(q);
  const all=[...base,...syn.flatMap(w=>tokenize(w))];
  const scored=rules.map(r=>{
    const hitWords=[...new Set([...base,...syn])].filter(w=>w.length>=2&&r.text.includes(w));
    return {...r, s:Math.round(bm25(r,all,rules,cache)*100)/100, hitWords};
  }).sort((a,b)=>b.s-a.s);
  const top=Math.max(0,...scored.map(x=>x.s));
  return {hits:scored.filter(x=>x.s>=2.0&&x.s>=top*0.35), all:scored};
}
function Hi({text,words}){
  const ws=words.filter(w=>w.length>=2);
  if(!ws.length)return <span>{text}</span>;
  const re=new RegExp("("+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  return <span>{text.split(re).map((p,i)=>ws.includes(p)?<mark key={i}>{p}</mark>:<span key={i}>{p}</span>)}</span>;
}

function Chat({rules}){
  const [q,setQ]=React.useState("経費精算の締め日はいつまで？");
  const EX=["経費精算の締め日はいつまで？","8万円の経費は誰の承認が必要？","領収書をなくした","有給はいつまでに申請する","在宅勤務は週何日まで？","ChatGPTに顧客情報を入れてよい？","3万円のモニターを買いたい","来月の忘年会の予算は？"];
  const {hits}=retrieve(q,rules);
  return (<div className="card">
    <h2>① 社内規程チャット <span className="sub">（規程を実検索して、根拠つきで回答）</span></h2>
    <div className="real">🔍 <b>質問を自由に入力</b>してください。登録規程{rules.length}件を検索し、<b>該当条文があればその条文を引用</b>して回答します。無ければ「該当なし」と答えます。</div>
    <input className="q" value={q} onChange={e=>setQ(e.target.value)} placeholder="例: 経費精算の締め日はいつまで？"/>
    <div className="chips">{EX.map((x,i)=>(<span className="chip" key={i} onClick={()=>setQ(x)}>{x}</span>))}</div>
    {hits.length===0
      ? <div className="refusal"><b>回答:</b> 該当する社内規程が見つかりませんでした。<b>根拠が確認できないため回答を差し控えます</b>（憶測では答えません）。→ 管理部へ確認するか、規程の追加登録をご検討ください。
          <div className="sub" style={{marginTop:6}}>（この“答えない”挙動が、誤情報を出さないための重要な仕様です）</div></div>
      : <div className="answer">
          <b>回答（該当条文 {hits.length}件）:</b>
          {hits.slice(0,3).map((h,i)=>(<div key={h.id} style={{marginTop:10}}>
            <div style={{fontSize:14,lineHeight:1.7}}>{i+1}. <Hi text={h.body} words={h.hitWords}/></div>
            <div className="cite">出典: <b>{h.cite}</b><span className="score">適合度 {h.s}</span></div>
          </div>))}
          <div className="sub" style={{marginTop:10}}>※上記は登録された規程本文<b>そのままの引用</b>です（AIが要約・創作していません）。</div>
        </div>}
  </div>);
}

function Approval(){
  const [step,setStep]=React.useState("form");
  const [title,setTitle]=React.useState("出張費の精算");
  const [amount,setAmount]=React.useState(80000);
  const [decision,setDecision]=React.useState(null);
  const [logs,setLogs]=React.useState([]);
  const approver=amount>50000?"部長":"上長";
  const rule=amount>50000?"経費精算規程 第4条（5万円超は部長承認）":"経費精算規程 第4条（5万円以下は上長承認）";
  const addLog=t=>setLogs(l=>[...l,new Date().toLocaleTimeString("ja-JP")+"  "+t]);
  const reset=()=>{setStep("form");setDecision(null);setLogs([]);};
  return (<div className="card">
    <h2>② 承認フロー <span className="sub">（このツール内で申請→承認まで完結）</span></h2>
    <p className="sub">金額から<b>規程に基づいて承認者を自動判定</b>します。全操作は監査ログに記録されます。</p>
    <div className="flowdiag">
      <span className={"step"+(step==="form"?" act":"")}>1. 申請作成</span><span className="arrow">→</span>
      <span className={"step"+(step==="submitted"?" act":"")}>2. 承認待ち</span><span className="arrow">→</span>
      <span className={"step"+(step==="decided"?" act":"")}>3. 承認/却下</span><span className="arrow">→</span>
      <span className={"step"+(step==="decided"?" act":"")}>4. 通知</span>
    </div>
    {step==="form" && <div>
      <div style={{margin:"8px 0"}}>件名: <input className="f" value={title} onChange={e=>setTitle(e.target.value)} style={{width:"55%"}}/></div>
      <div style={{margin:"8px 0"}}>金額: <input className="f" type="number" value={amount} onChange={e=>setAmount(Number(e.target.value)||0)}/> 円
        <div className="sub" style={{marginTop:4}}>→ 判定: 承認者は <b>{approver}</b>（根拠: {rule}）</div></div>
      <button className="primary" onClick={()=>{setStep("submitted");addLog("申請起票: "+title+" / "+amount+"円 / 承認者="+approver);}}>この内容で申請を起票</button>
    </div>}
    {step==="submitted" && <div>
      <p><span className="status">申請中</span> ／ 承認者: <b>{approver}</b> に回付されました。</p>
      <p className="sub">件名「{title}」・{amount.toLocaleString()}円 ／ 判定根拠: {rule}</p>
      <p>▼ あなた（承認者）の操作:</p>
      <button className="ok" onClick={()=>{setDecision("承認");setStep("decided");addLog("承認: "+approver+" が承認");}}>承認する</button>
      <button className="ng" onClick={()=>{setDecision("却下");setStep("decided");addLog("却下: "+approver+" が却下");}}>却下する</button>
      {logs.length>0 && <div className="log">{logs.map((l,i)=><div key={i}>{l}</div>)}</div>}
    </div>}
    {step==="decided" && <div>
      <p><span className="status" style={{color:decision==="承認"?"#17a673":"#e0533b"}}>{decision}されました</span></p>
      <p>件名「{title}」・{amount.toLocaleString()}円 ／ 決裁者: {approver}</p>
      <div className="answer">📣 通知: 承認チャンネルへ「{title} が{approver}により{decision}されました」を送信（実運用ではSlack/Teams/メール連携）。</div>
      <div className="log">{logs.map((l,i)=><div key={i}>{l}</div>)}<div>※これが監査ログです（誰が・いつ・何をしたかを全記録）</div></div>
      <button className="primary" style={{marginTop:10}} onClick={reset}>新しい申請を作る</button>
    </div>}
  </div>);
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="dify_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [raw,setRaw]=usePersist("raw",RULES0);
  const [edit,setEdit]=React.useState(false);
  const rules=parseRules(raw);
  return (<div className="wrap"><DataBar/>
    <h1>社内規程AI ＋ 承認フロー <span className="sub">規程を検索して根拠つきで回答 → 必要なら承認申請まで</span></h1>
    <Chat rules={rules}/>
    <Approval/>
    <div className="card">
      <h2>③ 規程データの管理</h2>
      <p className="sub">「### 出典名」で区切って自社の規程を登録できます。登録すると即、上の検索対象になります（現在 {rules.length}件）。</p>
      <button className="ghost" onClick={()=>setEdit(e=>!e)}>{edit?"閉じる":"規程を編集する"}</button>
      {edit && <textarea style={{marginTop:8}} value={raw} onChange={e=>setRaw(e.target.value)}/>}
      {!edit && <div className="sub" style={{marginTop:8}}>登録済み: {rules.map(r=>r.cite).join(" ／ ")}</div>}
    </div>
    <p className="note">※検索はブラウザ内の語彙スコア（BM25風）＋同義語辞書{Object.keys(SYN).length}語による実計算です。外部LLMは使用していないため、<b>回答は登録条文の引用のみ</b>で、AIが文章を創作することはありません。実運用では自社規程PDF/Markdownを取り込み、埋め込みベクトル検索を併用します。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}
