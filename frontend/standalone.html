<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社内規程AI＋承認フロー</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f5f7f9;margin:0;padding:24px;color:#152238}
    .wrap{max-width:820px;margin:0 auto} h1{color:#c0562b;font-size:22px}
    h2{font-size:16px;margin:2px 0 8px} .sub{color:#8a97a6;font-size:12px}
    .card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
    .chip{border:1px solid #e0c4b3;background:#fff;color:#a2461f;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
    .chip.on{background:#c0562b;color:#fff;border-color:#c0562b}
    .q{display:block;width:100%;text-align:left;border:1px solid #e6ebf1;background:#fbf6f3;border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:13px}
    .q:hover{background:#f6e9e2}
    .answer{background:#eef7f0;border-radius:10px;padding:14px;margin-top:8px}
    .refusal{background:#fdeeee;border-radius:10px;padding:14px;margin-top:8px}
    .cite{color:#0f7a54;font-size:12px;margin-top:6px} .cite b{background:#e7f7ef;padding:1px 7px;border-radius:6px}
    input{border:1px solid #cdd6df;border-radius:8px;padding:8px;font-size:14px}
    button.primary{background:#c0562b;color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:14px}
    button.ok{background:#17a673;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin-right:8px}
    button.ng{background:#e0533b;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
    .flowdiag{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:12px}
    .step{padding:5px 10px;border-radius:8px;background:#eef1f5;color:#556} .step.act{background:#c0562b;color:#fff;font-weight:bold}
    .arrow{color:#c9a} .status{font-weight:bold} .note{color:#8a97a6;font-size:12px}
    @media(max-width:640px){body{padding:14px} .wrap{max-width:100%} h1{font-size:19px}}
  </style>
</head>
<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>デモ版</b>：数値は<b>サンプル（実測・実データではありません）</b>。ロジックの見せ方を確認するためのプロトタイプです。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
const CATS={
  "経費":[
    {q:"経費精算の締め日は？", a:"経費精算の締め日は毎月20日です。20日を過ぎた申請は翌月扱いになります。", cite:"経費精算規程 第3条"},
    {q:"5万円を超える経費の承認は誰？", a:"5万円を超える経費は部長の承認が必要です。それ以下は上長承認です。", cite:"経費精算規程 第4条"},
    {q:"領収書は必要？", a:"経費申請には領収書等の証憑の添付が必須です。証憑がない申請は却下されます。", cite:"経費精算規程 第5条"}],
  "休暇":[
    {q:"有給休暇の申請方法は？", a:"取得希望日の3営業日前までに勤怠システムから申請してください。繁忙期は上長との調整が必要です。", cite:"社内FAQ 有給休暇"},
    {q:"有給の申請期限は？", a:"取得希望日の3営業日前までです。", cite:"社内FAQ 有給休暇"}],
  "在宅勤務":[
    {q:"在宅勤務は週何日まで？", a:"在宅勤務は週3日まで可能です。事前に上長へ申請し承認を得てください。", cite:"社内FAQ 在宅勤務"}],
  "禁止事項":[
    {q:"生成AIに顧客情報を入力してよい？", a:"", cite:null, refuse:true}],
  "備品購入":[
    {q:"備品購入の依頼方法は？", a:"1万円未満の備品は総務へ直接依頼できます。1万円以上は稟議申請が必要です。", cite:"社内FAQ 備品購入"}],
};
const REFUSAL="該当する社内規程・FAQが見つかりませんでした。根拠が確認できないため回答を差し控えます（憶測で答えません）。→ 管理部へ確認するか、規程の追加登録をご検討ください。";

function Chat(){
  const cats=Object.keys(CATS);
  const [cat,setCat]=React.useState(cats[0]);
  const [sel,setSel]=React.useState(null);
  return (<div className="card">
    <h2>① 社内規程チャット（AIが規程を検索して回答）</h2>
    <p className="sub">調べたいカテゴリを選び、例の質問をクリック。AIが<b>根拠(条番号)つき</b>で回答します。規程にない質問は<b>憶測せず「該当なし」</b>と答えます。</p>
    <div className="chips">{cats.map(c=>(<span key={c} className={"chip"+(c===cat?" on":"")} onClick={()=>{setCat(c);setSel(null);}}>{c}</span>))}</div>
    <div className="sub" style={{marginTop:8}}>「{cat}」でよく調べる質問の例:</div>
    {CATS[cat].map((item,i)=>(<button className="q" key={i} onClick={()=>setSel(item)}>🔍 {item.q}</button>))}
    {sel && (sel.refuse
      ? <div className="refusal"><b>回答:</b> {REFUSAL}<div className="sub" style={{marginTop:6}}>（この“答えない”挙動が、誤情報を出さないための重要な仕様です）</div></div>
      : <div className="answer"><b>AIの回答:</b> {sel.a}<div className="cite">出典: <b>{sel.cite}</b></div></div>)}
  </div>);
}

function Approval(){
  const [step,setStep]=React.useState("form"); // form -> submitted -> decided
  const [title,setTitle]=React.useState("出張費の精算");
  const [amount,setAmount]=React.useState(80000);
  const [decision,setDecision]=React.useState(null);
  const approver=amount>50000?"部長":"上長";
  const reset=()=>{setStep("form");setDecision(null);};
  return (<div className="card">
    <h2>② 承認フロー（このツール内で申請→承認まで完結）</h2>
    <p className="sub">チャットで「申請したい」となった内容を、この画面で起票→承認者が承認/却下→結果を通知します。承認は<b>ツール内で完結</b>し、通知はSlack/メール連携も可能(任意)。</p>

    <div className="flowdiag">
      <span className={"step"+(step==="form"?" act":"")}>1. 申請作成</span><span className="arrow">→</span>
      <span className={"step"+(step==="submitted"?" act":"")}>2. 承認待ち</span><span className="arrow">→</span>
      <span className={"step"+(step==="decided"?" act":"")}>3. 承認/却下</span><span className="arrow">→</span>
      <span className={"step"+(step==="decided"?" act":"")}>4. 通知</span>
    </div>

    {step==="form" && <div>
      <div style={{margin:"8px 0"}}>件名: <input value={title} onChange={e=>setTitle(e.target.value)} style={{width:"60%"}}/></div>
      <div style={{margin:"8px 0"}}>金額: <input type="number" value={amount} onChange={e=>setAmount(Number(e.target.value)||0)}/> 円
        <span className="sub"> → 金額により承認者を自動判定（5万円超は部長）: <b>{approver}</b></span></div>
      <button className="primary" onClick={()=>setStep("submitted")}>この内容で申請を起票</button>
    </div>}

    {step==="submitted" && <div>
      <p><span className="status">申請中</span> ／ 承認者: <b>{approver}</b> に回付されました。</p>
      <p className="sub">件名「{title}」・{amount.toLocaleString()}円</p>
      <p>▼ あなた(承認者)の操作:</p>
      <button className="ok" onClick={()=>{setDecision("承認");setStep("decided");}}>承認する</button>
      <button className="ng" onClick={()=>{setDecision("却下");setStep("decided");}}>却下する</button>
    </div>}

    {step==="decided" && <div>
      <p><span className="status" style={{color:decision==="承認"?"#17a673":"#e0533b"}}>{decision}されました</span></p>
      <p>件名「{title}」・{amount.toLocaleString()}円 ／ 決裁者: {approver}</p>
      <div className="answer">📣 通知(デモ): Slackの承認チャンネルへ「{title} が{approver}により{decision}されました」を送信しました。<div className="sub">※実運用ではSlack/Teams/メールに自動通知。全操作は監査ログに記録されます。</div></div>
      <button className="primary" style={{marginTop:10}} onClick={reset}>新しい申請を作る</button>
    </div>}
  </div>);
}

function App(){
  return (<div className="wrap">
    <h1>社内規程AI ＋ 承認フロー <span className="sub">規程をAIが回答 → 必要なら承認申請まで</span></h1>
    <Chat/>
    <Approval/>
    <p className="note">※回答内容はサンプル規程に基づくデモです。実運用では自社の規程PDF/Markdownを取り込みます。</p>
  </div>);
}
</script>
<script>(function(){var src=document.getElementById("__jsx").textContent;var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;(0,eval)(out);ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));})();</script>
</body></html>
